# nginx-Beispiel für das Network Portal (PHP-FPM)
# Kopieren nach /etc/nginx/sites-available/netportal, Pfade/Domain anpassen,
# verlinken nach sites-enabled, Zertifikat eintragen, nginx -t && systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name netz.example.com;

    ssl_certificate     /etc/ssl/certs/netz.example.com.pem;
    ssl_certificate_key /etc/ssl/private/netz.example.com.key;

    root /var/www/netportal;
    index index.php;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Gesperrt: Daten, Schlüssel, Programmteile (nginx ignoriert .htaccess!)
    location ~ ^/(config|database|includes|bin|pam-helper|server|system|icons|docs|\.cache)(/|$) { deny all; return 403; }
    location ~ /\.                         { deny all; return 403; }
    location ~ ^/(manifest\.sha256|README\.md|CHANGELOG\.md|LICENSE|router\.php)$ { deny all; return 403; }

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv;   # text/html ist immer dabei
    gzip_vary on;

    # Dateien in assets/ tragen eine Inhalts-Kennung (?v=…) – dauerhaft zwischenspeichern
    # (add_header in einem location-Block ersetzt die des server-Blocks – HSTS daher wiederholen)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 120s;   # "Alle pingen", SSH-Befehle, iperf3 (max. Dauer + 30 s)
        client_max_body_size 64m;    # Icon-Upload, simple-icons-Paket (.tgz)
    }
    location = / { rewrite ^ /index.php last; }
    location / { return 404; }
}

server {
    listen 80;
    server_name netz.example.com;
    return 301 https://$host$request_uri;
}
